services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/horilla"
    # UPDATED: This runs the web server. The Entrypoint script runs before this.
    command: gunicorn --bind 0.0.0.0:8000 horilla.wsgi:application
    volumes:
      # UPDATED: Matches WORKDIR /horilla in Dockerfile
      # Remove this line if you want to use the code inside the image (git clone)
      # Keep it if you want to edit code locally and see changes live.
      - ./horilla:/horilla  
      - ./media:/horilla/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bullseye
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # SCRAM-SHA-256 is good, but ensure your Django driver supports it. 
      # If connection fails, try removing this line.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - horilla-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  horilla-data: